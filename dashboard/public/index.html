<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whiskey Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #f5f5f5;
    }

    .status {
      font-size: 0.85rem;
      color: #9e9e9e;
      margin-bottom: 2rem;
      min-height: 1.2em;
    }

    .status time {
      color: #c9a54e;
    }

    button {
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.9rem 2.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
    }

    button:hover { background: #e74c3c; }
    button:active { transform: scale(0.97); }

    button:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
    }

    .confirm {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #6ab04c;
      min-height: 2.4em;
      transition: color 0.3s;
    }

    .divider {
      border: none;
      border-top: 1px solid #2a3a5e;
      margin: 2rem 0 1.5rem;
    }

    h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #f5f5f5;
    }

    .field-label {
      display: block;
      text-align: left;
      font-size: 0.8rem;
      color: #9e9e9e;
      margin: 1rem 0 0.4rem;
    }

    .setting-input {
      width: 100%;
      background: #0f1830;
      border: 1px solid #2a3a5e;
      border-radius: 10px;
      color: #f5f5f5;
      font-size: 1rem;
      padding: 0.9rem 1rem;
      text-align: center;
    }

    .setting-input:focus {
      outline: none;
      border-color: #c9a54e;
    }

    #updateBtn {
      margin-top: 1.5rem;
      background: #c9a54e;
      color: #1a1a2e;
    }

    #updateBtn:hover { background: #d8b863; }
    #updateBtn:disabled { background: #555; color: #999; }

    .hint {
      font-size: 0.75rem;
      color: #777;
      margin-top: 0.4rem;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Whiskey Button</h1>
    <div class="status" id="status">Connecting…</div>
    <button id="resetBtn" disabled>Reset Counter</button>
    <div class="confirm" id="confirm"></div>

    <hr class="divider">

    <h2>Settings</h2>

    <label class="field-label" for="durationInput">Pour duration (seconds)</label>
    <input id="durationInput" class="setting-input" type="number" inputmode="decimal"
           min="0.1" max="30" step="0.1" placeholder="seconds" disabled>
    <div class="hint">Seconds the valve stays open per press (0.1–30s).</div>

    <label class="field-label" for="maxPoursInput">Pours per day</label>
    <input id="maxPoursInput" class="setting-input" type="number" inputmode="numeric"
           min="1" max="100" step="1" placeholder="pours" disabled>
    <div class="hint">Total presses allowed before lockout (1–100).</div>

    <button id="updateBtn" disabled>Force Update</button>
    <div class="confirm" id="settingsConfirm"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
